# Passport Security — Git Secrets scanning config (gitleaks v8 format)
# Extends the built-in default rules plus Passport-specific allowlists.

[extend]
useDefault = true

[allowlist]
description = "Passport-specific allowlist — docs, examples and known-safe test fixtures"
paths = [
  '''^sdk/src/__tests__/''',
  '''^src/lib/__tests__/''',
  '''^src/lib/ingestion/tests/''',
  '''^src/lib/public-portal/tests/''',
  '''^python/tests/''',
  '''^audit/''',
  '''^docs/''',
  '''\.md$''',
]
# Known-safe placeholder patterns (test fixtures and Stripe test-mode prefixes)
regexes = [
  '''(?i)deadbeef''',
  '''(?i)example\.com''',
  '''(?i)localhost''',
  '''(?i)vitest-''',
  '''(?i)pp_test''',
  '''(?i)sk_test_''',
  '''(?i)whsec_test''',
]
