name: Deploy to Production
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t passport:latest .

      - name: Save and compress image
        run: docker save passport:latest | gzip > /tmp/passport-latest.tar.gz

      - name: Copy files to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_SERVER }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "/tmp/passport-latest.tar.gz,docker-compose.yml,Caddyfile"
          target: "/home/deploy/passport"
          strip_components: 0

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_SERVER }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/deploy/passport
            gunzip -c /tmp/passport-latest.tar.gz | docker load
            docker-compose run --rm app npx prisma migrate deploy
            docker-compose up -d --force-recreate app caddy
            rm -f /tmp/passport-latest.tar.gz
            docker image prune -f
            echo "Deploy complete"