[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "passport-sdk"
version = "0.1.0"
description = "Stdlib-only Passport SDK for LangGraph gate interceptors"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["passport_sdk*"]
