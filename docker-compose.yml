version: "3.8"

services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file: .env.production
    environment:
      - DATABASE_URL=postgresql://passport:${POSTGRES_PASSWORD:-passport}@db:5432/passport
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=passport
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-passport}
      - POSTGRES_DB=passport
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passport"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config: