services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: passport
      POSTGRES_PASSWORD: passport
      POSTGRES_DB: passport
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passport -d passport"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "5433:5432"

  app:
    image: passport:verify
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://passport:passport@postgres:5432/passport?schema=public
      SIGNING_PRIVATE_KEY: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      STRIPE_SECRET_KEY: sk_test_verify_fake
      STRIPE_WEBHOOK_SECRET: whsec_verify_test_secret
      STRIPE_PRICE_PRO: price_verify_test
      NODE_ENV: production
    ports:
      - "3000:3000"
